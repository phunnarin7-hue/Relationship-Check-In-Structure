<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Habit Scrapbook</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #fff5f9 0%, #f0f9ff 25%, #f5fff9 50%, #fffaf0 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255, 182, 193, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(216, 191, 216, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 920px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 2.5rem;
            box-shadow: 0 8px 32px rgba(255, 182, 193, 0.15);
            position: relative;
            border: 2px solid rgba(255, 200, 220, 0.3);
        }

        .container::before {
            content: '✨';
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 24px;
            opacity: 0.6;
        }

        .container::after {
            content: '🌸';
            position: absolute;
            bottom: 30px;
            left: 30px;
            font-size: 24px;
            opacity: 0.6;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
            position: relative;
        }

        .header h1 {
            font-family: 'Caveat', cursive;
            font-size: 48px;
            background: linear-gradient(135deg, #ff69b4 0%, #ba55d3 50%, #87ceeb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .header p {
            font-size: 14px;
            color: #a0a0a0;
            font-style: italic;
        }

        .doodle-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffb6c1, transparent);
            margin: 1.5rem 0;
            border-radius: 10px;
        }

        .add-section {
            background: linear-gradient(135deg, #fff0f6 0%, #f0f4ff 100%);
            border-radius: 25px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 2px dashed rgba(255, 182, 193, 0.4);
            position: relative;
        }

        .add-section::before {
            content: '📝';
            position: absolute;
            top: -12px;
            left: 30px;
            font-size: 28px;
        }

        .form-row {
            display: flex;
            gap: 12px;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 180px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #d946a6;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #ffb6d9;
            border-radius: 15px;
            font-size: 14px;
            font-family: 'Fredoka', sans-serif;
            background: rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #ff69b4;
            background: white;
            box-shadow: 0 0 0 3px rgba(255, 105, 180, 0.2);
            transform: scale(1.02);
        }

        .form-group input::placeholder {
            color: #d4a5d4;
        }

        .btn-add {
            padding: 12px 28px;
            background: linear-gradient(135deg, #ffb6d9 0%, #ff69b4 100%);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
            align-self: flex-end;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.4);
        }

        .btn-add:active {
            transform: scale(0.98);
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            padding: 10px 20px;
            background: white;
            border: 2px solid #e0bfe0;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
            font-family: 'Fredoka', sans-serif;
        }

        .filter-btn:hover {
            border-color: #ff69b4;
            background: #fff0f6;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #ffb6d9 0%, #ff69b4 100%);
            color: white;
            border-color: #ff69b4;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #a0a0a0;
        }

        .empty-state-emoji {
            font-size: 48px;
            margin-bottom: 1rem;
        }

        .habits-grid {
            display: grid;
            gap: 1.8rem;
        }

        .habit-card {
            background: linear-gradient(135deg, rgba(255, 240, 245, 0.9) 0%, rgba(240, 244, 255, 0.9) 100%);
            border: 2px solid rgba(255, 182, 193, 0.4);
            border-radius: 25px;
            padding: 1.8rem;
            animation: slideIn 0.4s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.1);
        }

        .habit-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255, 182, 193, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .habit-card.daily {
            border-color: rgba(255, 182, 193, 0.5);
        }

        .habit-card.weekly {
            border-color: rgba(173, 216, 230, 0.5);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(15px) rotate(-1deg);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotate(0deg);
            }
        }

        .habit-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1.2rem;
            position: relative;
            z-index: 1;
        }

        .habit-info h3 {
            font-family: 'Caveat', cursive;
            font-size: 24px;
            color: #ff69b4;
            margin-bottom: 0.5rem;
        }

        .habit-meta {
            font-size: 12px;
            color: #888;
        }

        .habit-frequency {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 0.5rem;
            letter-spacing: 0.5px;
        }

        .habit-frequency.daily {
            background: linear-gradient(135deg, #ffe4e8 0%, #ffd4dc 100%);
            color: #d63031;
        }

        .habit-frequency.weekly {
            background: linear-gradient(135deg, #e0f4ff 0%, #d4e8ff 100%);
            color: #0984e3;
        }

        .habit-actions {
            display: flex;
            gap: 8px;
        }

        .btn-delete {
            background: linear-gradient(135deg, #ffb6d9 0%, #ff69b4 100%);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(255, 105, 180, 0.2);
        }

        .btn-delete:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 105, 180, 0.3);
        }

        .streak {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #fff4e6 0%, #ffe6cc 100%);
            color: #d97706;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 1rem;
            border: 1px solid rgba(217, 119, 6, 0.2);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
        }

        .stat-item {
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.2) 0%, rgba(216, 191, 216, 0.2) 100%);
            padding: 14px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255, 182, 193, 0.3);
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff69b4 0%, #ba55d3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: #999;
            margin-top: 6px;
            font-size: 11px;
            font-weight: 500;
        }

        /* DAILY VIEW */
        .calendar-label {
            font-size: 13px;
            color: #999;
            margin-bottom: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
        }

        .day {
            aspect-ratio: 1.1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fff0f6 0%, #f0f4ff 100%);
            border: 2px solid #e8cfe0;
            border-radius: 12px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .day-name {
            font-size: 8px;
            color: #999;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .day-number {
            font-size: 13px;
            color: #555;
        }

        .day:hover:not(.empty) {
            background: linear-gradient(135deg, #ffb6d9 0%, #ffc0e0 100%);
            border-color: #ff69b4;
            transform: scale(1.08);
        }

        .day.completed {
            background: linear-gradient(135deg, #ffb6d9 0%, #ff69b4 100%);
            color: white;
            border-color: #ff69b4;
            box-shadow: 0 4px 12px rgba(255, 105, 180, 0.3);
        }

        .day.completed .day-name {
            color: rgba(255, 255, 255, 0.8);
        }

        .day.completed .day-number {
            color: white;
        }

        .day.empty {
            background: transparent;
            border: none;
            cursor: default;
        }

        .day.empty:hover {
            background: transparent;
            border: none;
            transform: scale(1);
        }

        /* WEEKLY VIEW */
        .view-weekly {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 12px;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
        }

        .week-day {
            padding: 18px 12px;
            background: linear-gradient(135deg, rgba(255, 240, 245, 0.8) 0%, rgba(240, 250, 255, 0.8) 100%);
            border: 2px solid #d4a5d4;
            border-radius: 18px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .week-day:hover {
            border-color: #ff69b4;
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(255, 105, 180, 0.2);
        }

        .week-day.completed {
            background: linear-gradient(135deg, #ffb6d9 0%, #ff69b4 100%);
            border-color: #ff69b4;
            color: white;
        }

        .week-day-name {
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }

        .week-day.completed .week-day-name {
            color: white;
        }

        .week-day-check {
            font-size: 24px;
        }

        .btn-today {
            width: 100%;
            padding: 14px;
            background: white;
            border: 2px solid #ffb6d9;
            border-radius: 18px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            margin-top: 1rem;
            position: relative;
            z-index: 1;
            font-family: 'Fredoka', sans-serif;
        }

        .btn-today:hover {
            background: #fff0f6;
            border-color: #ff69b4;
        }

        .btn-today.completed {
            background: linear-gradient(135deg, #ffb6d9 0%, #ff69b4 100%);
            border-color: #ff69b4;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
        }

        @media (max-width: 600px) {
            .container {
                padding: 1.5rem;
                border-radius: 20px;
            }

            .header h1 {
                font-size: 36px;
            }

            .form-row {
                flex-direction: column;
            }

            .form-group {
                min-width: unset;
            }

            .habit-header {
                flex-direction: column;
                gap: 0.75rem;
            }

            .habit-actions {
                width: 100%;
            }

            .habit-actions button {
                flex: 1;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .view-weekly {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✨ My Habit Scrapbook ✨</h1>
            <p>Track your daily & weekly wins 🎀</p>
        </div>

        <div class="doodle-line"></div>

        <div class="add-section">
            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label>📌 Habit Name</label>
                    <input type="text" id="habitInput" placeholder="e.g., Morning coffee, Read a book, Yoga..." />
                </div>
                <div class="form-group">
                    <label>📅 Type</label>
                    <select id="frequencyInput">
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>&nbsp;</label>
                    <button class="btn-add" onclick="addHabit()">✨ Add Habit</button>
                </div>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="filterHabits('all')">All</button>
            <button class="filter-btn" onclick="filterHabits('daily')">Daily</button>
            <button class="filter-btn" onclick="filterHabits('weekly')">Weekly</button>
        </div>

        <div id="habitsList"></div>
    </div>

    <script>
        const today = new Date().toISOString().split('T')[0];
        let currentFilter = 'all';

        function loadHabits() {
            const stored = localStorage.getItem('habits');
            return stored ? JSON.parse(stored) : [];
        }

        function saveHabits(habits) {
            localStorage.setItem('habits', JSON.stringify(habits));
        }

        function addHabit() {
            const input = document.getElementById('habitInput');
            const frequency = document.getElementById('frequencyInput').value;
            const name = input.value.trim();
            if (!name) return;

            const habits = loadHabits();
            habits.push({
                id: Date.now(),
                name: name,
                frequency: frequency,
                dates: [],
                createdDate: today
            });
            saveHabits(habits);
            input.value = '';
            render();
        }

        function deleteHabit(id) {
            if (!confirm('Delete this habit? 🥺')) return;
            let habits = loadHabits();
            habits = habits.filter(h => h.id !== id);
            saveHabits(habits);
            render();
        }

        function toggleDate(id, date) {
            const habits = loadHabits();
            const habit = habits.find(h => h.id === id);
            if (!habit) return;

            const idx = habit.dates.indexOf(date);
            if (idx >= 0) {
                habit.dates.splice(idx, 1);
            } else {
                habit.dates.push(date);
            }
            saveHabits(habits);
            render();
        }

        function filterHabits(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            render();
        }

        function getStreak(habit) {
            if (habit.dates.length === 0) return 0;
            const sorted = [...habit.dates].sort().reverse();
            let streak = 0;
            const todayDate = new Date(today);

            for (let i = 0; i < sorted.length; i++) {
                const checkDate = new Date(sorted[i]);
                const expectedDate = new Date(todayDate);
                expectedDate.setDate(expectedDate.getDate() - i);

                if (checkDate.toISOString().split('T')[0] === expectedDate.toISOString().split('T')[0]) {
                    streak++;
                } else {
                    break;
                }
            }
            return streak;
        }

        function getCalendarDays(date = today) {
            const [year, month] = date.split('-').slice(0, 2).map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();
            const firstDay = new Date(year, month - 1, 1).getDay();
            const days = [];

            for (let i = 0; i < firstDay; i++) days.push(null);
            for (let i = 1; i <= daysInMonth; i++) {
                const d = String(i).padStart(2, '0');
                days.push(`${year}-${String(month).padStart(2, '0')}-${d}`);
            }
            return days;
        }

        function getWeekDays() {
            const todayObj = new Date(today);
            const days = [];
            const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            
            for (let i = 0; i < 7; i++) {
                const date = new Date(todayObj);
                date.setDate(date.getDate() - todayObj.getDay() + i);
                const dateStr = date.toISOString().split('T')[0];
                const dayName = dayNames[i];
                days.push({ date: dateStr, name: dayName });
            }
            return days;
        }

        function renderDailyView(habit) {
            const calendarDays = getCalendarDays();
            const monthYear = new Date(today).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

            const calendarHTML = calendarDays.map(date => {
                if (!date) return '<button class="day empty"></button>';
                const isChecked = habit.dates.includes(date);
                const dayNum = new Date(date).getDate();
                const dayName = new Date(date).toLocaleDateString('en-US', { weekday: 'short' })[0];
                return `<button class="day ${isChecked ? 'completed' : ''}" onclick="toggleDate(${habit.id}, '${date}')"><span class="day-name">${dayName}</span><span class="day-number">${dayNum}</span></button>`;
            }).join('');

            return `
                <div class="view-daily">
                    <div class="calendar-label">📆 ${monthYear}</div>
                    <div class="calendar-grid">${calendarHTML}</div>
                </div>
            `;
        }

        function renderWeeklyView(habit) {
            const weekDays = getWeekDays();
            const weekHTML = weekDays.map(day => {
                const isChecked = habit.dates.includes(day.date);
                return `
                    <button class="week-day ${isChecked ? 'completed' : ''}" onclick="toggleDate(${habit.id}, '${day.date}')">
                        <div class="week-day-name">${day.name}</div>
                        <div class="week-day-check">${isChecked ? '✓' : '○'}</div>
                    </button>
                `;
            }).join('');

            return `
                <div class="view-weekly">${weekHTML}</div>
            `;
        }

        function render() {
            const habits = loadHabits();
            const filtered = currentFilter === 'all' ? habits : habits.filter(h => h.frequency === currentFilter);
            const list = document.getElementById('habitsList');

            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="empty-state-emoji">🌸</div><p>No habits yet. Create your first one! 💕</p></div>';
                return;
            }

            list.innerHTML = `<div class="habits-grid">${filtered.map((habit, idx) => {
                const streak = getStreak(habit);
                const isCompletedToday = habit.dates.includes(today);
                const createdDate = new Date(habit.createdDate).toLocaleDateString();
                const completionRate = habit.dates.length;
                const daysSinceCreation = Math.ceil((new Date(today) - new Date(habit.createdDate)) / (1000 * 60 * 60 * 24)) + 1;

                const viewHTML = habit.frequency === 'daily' 
                    ? renderDailyView(habit)
                    : renderWeeklyView(habit);

                return `
                    <div class="habit-card ${habit.frequency}" style="animation-delay: ${idx * 0.05}s">
                        <div class="habit-header">
                            <div>
                                <h3>${habit.name}</h3>
                                <div class="habit-meta">
                                    <span class="habit-frequency ${habit.frequency}">${habit.frequency}</span>
                                    <span> · Since ${createdDate}</span>
                                </div>
                            </div>
                            <div class="habit-actions">
                                <button class="btn-delete" onclick="deleteHabit(${habit.id})">🗑️</button>
                            </div>
                        </div>

                        <div class="stats">
                            <div class="stat-item">
                                <div class="stat-value">${completionRate}</div>
                                <div class="stat-label">✨ Total</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value">${Math.round((completionRate / daysSinceCreation) * 100)}%</div>
                                <div class="stat-label">🎯 Success</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value">${streak}</div>
                                <div class="stat-label">🔥 Streak</div>
                            </div>
                        </div>

                        ${streak > 0 ? `<div class="streak">🔥 ${streak} day streak! You're amazing! 💪</div>` : ''}

                        ${viewHTML}

                        <button class="btn-today ${isCompletedToday ? 'completed' : ''}" onclick="toggleDate(${habit.id}, '${today}')">
                            ${isCompletedToday ? '✓ Yes! Done today 🎉' : '◯ Mark as done today'}
                        </button>
                    </div>
                `;
            }).join('')}</div>`;
        }

        document.getElementById('habitInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addHabit();
        });

        render();
    </script>
</body>
</html>
